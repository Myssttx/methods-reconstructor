[project]
name = "methods-reconstructor-backend"
version = "0.1.0"
description = "FastAPI backend + recursive citation-resolving agent for Methods Reconstructor"
readme = "../README.md"
requires-python = ">=3.11,<3.13"
license = {text = "Apache-2.0"}
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.48.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.6.0",
    "httpx==0.28.1",
    "elasticsearch==8.15.1",
    "aiohttp==3.10.10",
    "sentence-transformers==3.2.0",
    "sse-starlette==2.1.3",
    "tenacity==9.0.0",
    "python-multipart==0.0.12",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "arxiv==2.1.3",
    "crossrefapi==1.6.0",
    "redis==5.1.1",
    "structlog==24.4.0",
    "reportlab==4.2.5",
    "google-adk[mcp]==2.2.0",
    "google-genai==2.8.0",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-aiplatform==1.71.0",
    "google-cloud-firestore==2.19.0",
    "google-cloud-storage==2.18.2",
]
anthropic = [
    "anthropic>=0.39.0",
]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-mock==3.14.0",
    "ruff==0.7.0",
    "mypy==1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
