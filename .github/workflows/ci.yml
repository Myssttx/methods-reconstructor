name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.0 "uvicorn[standard]==0.32.0" pydantic==2.9.2 \
            pydantic-settings==2.6.0 httpx==0.27.2 elasticsearch==8.15.1 \
            sse-starlette==2.1.3 tenacity==9.0.0 python-multipart==0.0.12 \
            beautifulsoup4==4.12.3 lxml==5.3.0 arxiv==2.1.3 crossrefapi==1.6.0 \
            redis==5.1.1 structlog==24.4.0 pytest==8.3.3 pytest-asyncio==0.24.0 \
            ruff==0.7.0
      - name: Ruff
        working-directory: backend
        run: ruff check app tests
      - name: Unit tests
        working-directory: backend
        env:
          LLM_PROVIDER: offline
          EMBEDDINGS_FAKE: "1"
        run: pytest tests/unit -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Type check + build
        working-directory: frontend
        run: npm run build
