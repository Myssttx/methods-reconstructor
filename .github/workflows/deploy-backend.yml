name: Deploy backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/deploy-backend.yml"
      - ".dockerignore"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: "${{ vars.GCP_PROJECT_ID }}"
      REGION: "${{ vars.GCP_REGION }}"
      SERVICE: "${{ vars.CLOUD_RUN_SERVICE }}"
      REPOSITORY: "${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}"
      RUNTIME_SERVICE_ACCOUNT: "${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}"
      FRONTEND_ORIGIN: "${{ vars.FRONTEND_ORIGIN }}"
      ELASTIC_CLOUD_ID_SECRET: "${{ vars.ELASTIC_CLOUD_ID_SECRET }}"
      ELASTIC_API_KEY_SECRET: "${{ vars.ELASTIC_API_KEY_SECRET }}"
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment variables
        run: |
          for name in PROJECT_ID REGION SERVICE REPOSITORY RUNTIME_SERVICE_ACCOUNT FRONTEND_ORIGIN ELASTIC_CLOUD_ID_SECRET ELASTIC_API_KEY_SECRET; do
            test -n "${!name}" || {
              echo "Missing repository variable: $name"
              exit 1
            }
          done
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}"
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          docker build -f backend/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy Cloud Run service
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --port 8000 \
            --timeout 900 \
            --concurrency 4 \
            --max-instances 1 \
            --no-cpu-throttling \
            --set-env-vars "APP_ENV=production,APP_CORS_ORIGINS=${FRONTEND_ORIGIN},GCP_PROJECT_ID=${PROJECT_ID},VERTEX_AI_LOCATION=${REGION},LLM_PROVIDER=auto,ENABLE_FIRESTORE=1,ENABLE_VERTEX_EMBEDDINGS=1,EMBEDDINGS_FAKE=0,APP_AGENT_TIMEOUT_SECONDS=600" \
            --set-secrets "ELASTIC_CLOUD_ID=${ELASTIC_CLOUD_ID_SECRET}:latest,ELASTIC_API_KEY=${ELASTIC_API_KEY_SECRET}:latest"
      - name: Print service URL
        run: |
          gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format="value(status.url)"
