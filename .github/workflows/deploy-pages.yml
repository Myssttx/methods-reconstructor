name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      enabled: "${{ steps.check.outputs.enabled }}"
    env:
      BACKEND_URL: "${{ vars.BACKEND_URL }}"
    steps:
      - id: check
        name: Check deployment configuration
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages deployment skipped; set repository variable BACKEND_URL to the deployed backend URL."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: configuration
    if: needs.configuration.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build static site
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/${{ github.event.repository.name }}"
          NEXT_PUBLIC_API_BASE_URL: "${{ vars.BACKEND_URL }}"
          NEXT_PUBLIC_SSE_URL: "${{ vars.BACKEND_URL }}"
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
