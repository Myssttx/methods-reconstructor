services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx1g
    # H-9: No host port binding — ES is only reachable from within the Docker network.
    # Uncomment the line below ONLY for local debugging (never in staging/production):
    # ports:
    #   - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - es_data:/usr/share/elasticsearch/data

  redis:
    image: redis:7-alpine
    # L-9: Redis is password-protected and not exposed on the host.
    # Set REDIS_PASSWORD in .env and it is forwarded here via the command below.
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --requirepass "$$REDIS_PASSWORD"
        else
          redis-server
        fi
      '
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    # H-9: No host port binding — Redis only reachable inside Docker network.
    # ports:
    #   - "127.0.0.1:6379:6379"
    healthcheck:
      test: >
        sh -c '
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli -a "$$REDIS_PASSWORD" ping
          else
            redis-cli ping
          fi
        '
      interval: 10s
      retries: 5

  grobid:
    image: grobid/grobid:0.9.0-crf
    ports:
      - "8070:8070"
    profiles:
      - pdf
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/api/isalive"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ./.env
    environment:
      - ELASTIC_URL=http://elasticsearch:9200
      - REDIS_HOST=redis
      - GROBID_URL=http://grobid:8070
      - GOOGLE_APPLICATION_CREDENTIALS=/gcp/application_default_credentials.json
    ports:
      - "8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./infra:/app/infra:ro
      - ./.local_storage:/app/.local_storage
      - ~/.config/gcloud/application_default_credentials.json:/gcp/application_default_credentials.json:ro
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  worker:
    build: ./backend
    env_file: ./.env
    environment:
      - ELASTIC_URL=http://elasticsearch:9200
      - REDIS_HOST=redis
      - GROBID_URL=http://grobid:8070
      - GOOGLE_APPLICATION_CREDENTIALS=/gcp/application_default_credentials.json
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./infra:/app/infra:ro
      - ./.local_storage:/app/.local_storage
      - ~/.config/gcloud/application_default_credentials.json:/gcp/application_default_credentials.json:ro
    command: python -m app.agent.queue

  frontend:
    build: ./frontend
    env_file: ./.env
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NEXT_PUBLIC_SSE_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  es_data:
